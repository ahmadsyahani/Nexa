name: Build Nexa App (APK & IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # ANDROID
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # IOS
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: ⚙️ Generate and Patch Podfile
        working-directory: ios
        run: |
          # Perintah ini memaksa flutter membuat folder ios/Pods dan ios/Podfile tanpa nge-build full
          flutter build ios --config-only || true
          
          # Paksa minimum iOS ke 14.0 di Podfile agar package modern tidak error
          if [ -f "Podfile" ]; then
            sed -i '' "s/^# platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile
            sed -i '' "s/^platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile
            sed -i '' "s/^platform :ios, '13.0'/platform :ios, '14.0'/g" Podfile
          fi
          
          # Hapus Podfile.lock kalau ada yang nyangkut
          rm -f Podfile.lock
          
          # Install pods manual dengan repo-update supaya pasti fresh
          pod install --repo-update

      - name: 🔨 Build iOS (unsigned, no Apple Developer cert needed)
        run: flutter build ios --release --no-codesign

      - name: 🗜️ Package into .IPA File
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Nexa-iOS-Unsigned.ipa Payload/
          echo "✅ IPA created: $(du -sh Nexa-iOS-Unsigned.ipa)"

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-iOS-IPA
          path: Nexa-iOS-Unsigned.ipa
          retention-days: 30